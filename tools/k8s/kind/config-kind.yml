apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30000
    hostPort: 30000
  - containerPort: 30001
    hostPort: 30001
  - containerPort: 30002
    hostPort: 30002
  - containerPort: 30778
    hostPort: 30778
  - containerPort: 30080
    hostPort: 80
- role: worker
  labels:
    nodetype: app
    app: devsecops
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        register-with-taints: "xpto=true:NoSchedule"
- role: worker
  labels:
    nodetype: app
- role: worker
  labels:
    nodetype: db